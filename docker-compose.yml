# Usage:
#   cp .env.example .env   # fill in your own PingOne env
#   docker compose up --build
services:
  mcp-resource-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${VERTICAL:-banking}-mcp-resource-server
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VERTICAL: ${VERTICAL:-banking}
    volumes:
      # SQLite database for the active vertical, seeded at startup from the
      # image's verticals/ dir. Bind mount so data survives a container recreate.
      - ./data:/app/data
    restart: unless-stopped
