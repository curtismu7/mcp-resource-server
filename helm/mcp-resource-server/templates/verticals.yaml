{{- range $name, $files := .Values.verticals }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-resource-server.fullname" $ }}-vertical-{{ $name }}
  labels:
    {{- include "mcp-resource-server.labels" $ | nindent 4 }}
data:
  {{- range $file, $content := $files }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
